repos:
  # Frontend (React/TypeScript) hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json

  # ESLint for TypeScript/React, from the toolchain locked in package-lock.json
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx --no-install eslint --max-warnings=0 --no-warn-ignored
        language: system
        files: \.(js|ts|tsx)$
        types: [file]

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript Check
        entry: npx --no-install tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Linting frontend
  - repo: local
    hooks:
      - id: npm-run-lint
        name: Npm Run Lint
        entry: npm run lint -- --max-warnings=0
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Cargo fmt for Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo Fmt
        entry: bash -c 'cd src-tauri && cargo fmt -- --quiet'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

  # Cargo check for Rust
  - repo: local
    hooks:
      - id: cargo-check
        name: Cargo Check
        entry: bash -c 'cd src-tauri && cargo check'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

  # Cargo test for Rust
  - repo: local
    hooks:
      - id: cargo-test
        name: Cargo Test
        entry: bash -c 'cd src-tauri && cargo test'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

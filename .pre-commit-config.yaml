repos:
  # Frontend (React/TypeScript) hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json

  # ESLint for TypeScript/React
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.10.0
    hooks:
      - id: eslint
        files: \.(js|ts|tsx)$
        types: [file]
        # Keep this list in sync with the devDependencies in package.json - this
        # hook installs its own copy of the toolchain, so any drift here lints
        # with different rules than `npm run lint` does.
        # `typescript` is aliased to the TypeScript 6 API package on purpose:
        # typescript-eslint cannot load the TypeScript 7 compiler yet, while
        # `tsc` itself runs TypeScript 7 through the `@typescript/native` alias.
        additional_dependencies:
          - eslint@^10.9.1
          - '@eslint/js@^10.0.1'
          - 'typescript-eslint@^8.49.0'
          - 'eslint-plugin-react-hooks@^7.1.1'
          - 'eslint-plugin-react-refresh@^0.5.6'
          - 'typescript@npm:@typescript/typescript6@^6.0.2'
          - 'globals@^16.4.0'
          - '@types/react@^19.2.18'
          - '@types/react-dom@^19.2.7'

  # TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript Check
        entry: npx tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Linting frontend
  - repo: local
    hooks:
      - id: npm-run-lint
        name: Npm Run Lint
        entry: npm run lint -- --max-warnings=0
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Cargo fmt for Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo Fmt
        entry: bash -c 'cd src-tauri && cargo fmt -- --quiet'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

  # Cargo check for Rust
  - repo: local
    hooks:
      - id: cargo-check
        name: Cargo Check
        entry: bash -c 'cd src-tauri && cargo check'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

  # Cargo test for Rust
  - repo: local
    hooks:
      - id: cargo-test
        name: Cargo Test
        entry: bash -c 'cd src-tauri && cargo test'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false

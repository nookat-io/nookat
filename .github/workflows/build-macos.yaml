name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version-tag:
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Set public key for updater
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          echo "Setting Tauri signing public key..."
          cd src-tauri
          sed -i.bak "s/YOUR_PUBLIC_KEY_HERE/$TAURI_SIGNING_PUBLIC_KEY/g" tauri.conf.json && rm tauri.conf.json.bak
          if ! grep -q "$TAURI_SIGNING_PUBLIC_KEY" tauri.conf.json; then
            echo "Updater public key replacement failed."
            exit 1
          fi

      - name: Build without uploading
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: '-'
          VITE_APTABASE_APP_KEY: ${{ secrets.VITE_APTABASE_APP_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin

      - name: Verify ad-hoc signature
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          set -euo pipefail

          APPS=$(printf '%s' "$ARTIFACT_PATHS" | jq -r '.[] | select(endswith(".app"))')
          if [ -z "$APPS" ]; then
            echo "No .app bundle found in the build artifacts:"
            printf '%s\n' "$ARTIFACT_PATHS"
            exit 1
          fi

          while IFS= read -r app; do
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app"
          done <<< "$APPS"

          echo "Ad-hoc signature verified. The app is intentionally not notarized."

      - name: Publish the verified bundle to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: '-'
          VITE_APTABASE_APP_KEY: ${{ secrets.VITE_APTABASE_APP_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version-tag }}
          releaseName: 'Nookat ${{ inputs.version-tag }}'
          releaseDraft: true
          includeUpdaterJson: false
          args: --target universal-apple-darwin

      - name: Build Summary
        run: |
          echo "✅ macOS build completed successfully!"
          echo "Version: ${{ inputs.version }}"
          echo "Version Tag: ${{ inputs.version-tag }}"
          echo "Target: universal-apple-darwin (aarch64 + x86_64)"
          echo "Signing: ad-hoc, no Developer ID, not notarized - users must allow the app in Privacy & Security"

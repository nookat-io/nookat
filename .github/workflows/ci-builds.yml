name: '[CI] Platform Builds'

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  check-pr-status:
    name: Check PR Status
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
    - name: Check PR readiness
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        PR_ACTION: ${{ github.event.action }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "reason=$EVENT_NAME run" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$PR_DRAFT" == "true" ]]; then
          echo "should_build=false" >> "$GITHUB_OUTPUT"
          echo "reason=PR is still in draft mode" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "${PR_TITLE,,}" =~ wip ]]; then
          echo "should_build=false" >> "$GITHUB_OUTPUT"
          echo "reason=PR title contains WIP" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$PR_LABELS" =~ "ready-to-merge" ]]; then
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "reason=PR has ready-to-merge label" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "should_build=false" >> "$GITHUB_OUTPUT"
        echo "reason=PR not ready for platform builds" >> "$GITHUB_OUTPUT"

  platform-builds:
    name: Platform Builds
    runs-on: ${{ matrix.os }}
    needs: [check-pr-status, changes]
    if: ${{ !cancelled() && needs.check-pr-status.outputs.should_build == 'true' && needs.changes.outputs.tasks_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-2022]
        include:
          - os: ubuntu-22.04
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libwebkit2gtk-4.1-dev \
                libappindicator3-dev \
                librsvg2-dev \
                patchelf
          - os: macos-26
            deps: |
              brew install pkg-config openssl
          - os: windows-2022
            deps: |
              echo "Windows dependencies handled by Tauri"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install frontend dependencies
      uses: ./.github/actions/install-frontend

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: ${{ matrix.deps }}

    - name: Restore the Rust build cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        save-if: ${{ github.event_name != 'pull_request' }}
        cache-on-failure: true

    - name: Build frontend
      run: npm run build

    - name: Build Tauri application
      run: |
        cd src-tauri
        cargo build --release

    - name: Run tests
      run: |
        cd src-tauri
        cargo test --release

    - name: Build status
      run: |
        echo "✅ Platform build successful for ${{ matrix.os }}"
        echo "Build completed at: $(date)"
        echo "Trigger reason: ${{ needs.check-pr-status.outputs.reason }}"

  platform-builds-not-needed:
    name: Platform Builds
    runs-on: ubuntu-22.04
    needs: [changes]
    if: needs.changes.outputs.tasks_only == 'true'
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-26, windows-2022]

    steps:
    - name: Skip the build
      env:
        OS: ${{ matrix.os }}
      run: echo "The pull request changes only tasks/, so $OS needs no platform build"

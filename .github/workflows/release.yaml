name: '[CD] Release'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release-coordinator:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version-tag: ${{ steps.get-version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(jq -r '.version' < src-tauri/tauri.conf.json)
          VERSION_TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version-tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Version Tag: $VERSION_TAG"

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION_TAG: ${{ steps.get-version.outputs.version-tag }}
        run: |
          if [ "$TAG" != "$VERSION_TAG" ]; then
            echo "::error::Tag $TAG does not match version $VERSION_TAG in src-tauri/tauri.conf.json. Bump the version with 'just upgrade_version' and tag that commit."
            exit 1
          fi

      - name: Prepare Release
        run: |
          echo "Preparing release ${{ steps.get-version.outputs.version-tag }}..."
          echo "Release coordination started at $(date)"

  build-macos:
    needs: release-coordinator
    uses: ./.github/workflows/build-macos.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets: inherit

  build-windows:
    needs: release-coordinator
    uses: ./.github/workflows/build-windows.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets: inherit

  build-linux:
    needs: release-coordinator
    uses: ./.github/workflows/build-linux.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets: inherit

  updater-manifest:
    needs: [release-coordinator, build-macos, build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Publish latest.json from the uploaded signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-coordinator.outputs.version-tag }}
          VERSION: ${{ needs.release-coordinator.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]' > "$RUNNER_TEMP/asset-names.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$RUNNER_TEMP/signatures"
          node .github/scripts/updater-manifest.mjs "$RUNNER_TEMP/asset-names.json" "$RUNNER_TEMP/signatures" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

  release-completion:
    needs: [release-coordinator, build-macos, build-windows, build-linux, updater-manifest]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check build status
        run: |
          echo "Build Status Summary:"
          echo "macOS: ${{ needs.build-macos.result }}"
          echo "Windows: ${{ needs.build-windows.result }}"
          echo "Linux: ${{ needs.build-linux.result }}"
          echo "Updater manifest: ${{ needs.updater-manifest.result }}"

          if [[ "${{ needs.build-macos.result }}" == "success" && "${{ needs.build-windows.result }}" == "success" && "${{ needs.build-linux.result }}" == "success" && "${{ needs.updater-manifest.result }}" == "success" ]]; then
            echo "✅ All platform builds completed successfully!"
          else
            echo "❌ Some platform builds failed. Check individual workflow runs for details."
            exit 1
          fi

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ needs.release-coordinator.outputs.version-tag }} completed!"
          echo "All platform builds have been published to GitHub releases."
          echo "Release is available as a draft and can be published manually."

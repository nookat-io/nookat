name: '[CD] Release'

on:
  workflow_dispatch:
  # A release starts when its version tag is pushed, or created by publishing
  # a GitHub release for a new tag. The tag must match the version in
  # tauri.conf.json, see "Check the tag matches the version" below.
  push:
    tags:
      - 'v*'

concurrency:
  # This prevents concurrency
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # Orchestrator job that coordinates the release process
  release-coordinator:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      version-tag: ${{ steps.get-version.outputs.version-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(jq -r '.version' < src-tauri/tauri.conf.json)
          VERSION_TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Version Tag: $VERSION_TAG"

      # The builds read the version from tauri.conf.json, not from the tag, and
      # upload to the release named after that version. A tag on a commit whose
      # version was not bumped would rebuild the previous version and overwrite
      # the assets of its already published release.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION_TAG: ${{ steps.get-version.outputs.version-tag }}
        run: |
          if [ "$TAG" != "$VERSION_TAG" ]; then
            echo "::error::Tag $TAG does not match version $VERSION_TAG in src-tauri/tauri.conf.json. Bump the version with 'just upgrade_version' and tag that commit."
            exit 1
          fi

      - name: Prepare Release
        run: |
          echo "Preparing release ${{ steps.get-version.outputs.version-tag }}..."
          echo "Release coordination started at $(date)"

  # macOS build job (ad-hoc signed, not notarized - see build-macos.yaml)
  build-macos:
    needs: release-coordinator
    uses: ./.github/workflows/build-macos.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets:
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_APTABASE_APP_KEY: ${{ secrets.VITE_APTABASE_APP_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  # Windows build job
  build-windows:
    needs: release-coordinator
    uses: ./.github/workflows/build-windows.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets:
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_APTABASE_APP_KEY: ${{ secrets.VITE_APTABASE_APP_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  # Linux build job
  build-linux:
    needs: release-coordinator
    uses: ./.github/workflows/build-linux.yaml
    with:
      version: ${{ needs.release-coordinator.outputs.version }}
      version-tag: ${{ needs.release-coordinator.outputs.version-tag }}
    secrets:
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_APTABASE_APP_KEY: ${{ secrets.VITE_APTABASE_APP_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  # Final release coordination
  release-completion:
    needs: [release-coordinator, build-macos, build-windows, build-linux]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Check build status
        run: |
          echo "Build Status Summary:"
          echo "macOS: ${{ needs.build-macos.result }}"
          echo "Windows: ${{ needs.build-windows.result }}"
          echo "Linux: ${{ needs.build-linux.result }}"

          if [[ "${{ needs.build-macos.result }}" == "success" && "${{ needs.build-windows.result }}" == "success" && "${{ needs.build-linux.result }}" == "success" ]]; then
            echo "✅ All platform builds completed successfully!"
          else
            echo "❌ Some platform builds failed. Check individual workflow runs for details."
            exit 1
          fi

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ needs.release-coordinator.outputs.version-tag }} completed!"
          echo "All platform builds have been published to GitHub releases."
          echo "Release is available as a draft and can be published manually."

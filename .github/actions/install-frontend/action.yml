name: Install frontend dependencies
description: Restores node_modules that npm ci installed from the same package.json, lockfile and .npmrc on this runner and Node version, or runs npm ci and saves the result

inputs:
  save-cache:
    description: Save node_modules after npm ci, on runs outside pull requests
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*

    - name: Restore node_modules
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}

    - name: Install with npm ci
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Save node_modules
      if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.restore.outputs.cache-primary-key }}
